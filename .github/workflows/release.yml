name: Release

# Publish GitHub Releases with Windows (.zip) and Android (.apk) artifacts
# whenever a version tag like v1.0.0 is pushed.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      # Flutter drops the binaries in build/windows/x64/runner/Release/
      # (Windows filesystem is case-insensitive, so this path is safe).
      - name: Archive Windows build
        shell: pwsh
        run: |
          $stage = "dist"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $zipName = "Ritualist-windows-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$stage\$zipName"
        working-directory: app

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: app/dist/*.zip

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fail fast with a clear message instead of a corrupt/empty keystore later.
      - name: Check signing secrets are configured
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. See repo docs (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Decode Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Build Android release APK
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Stage APK for release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Ritualist-android-${{ github.ref_name }}.apk"

      # Guard against shipping anything that quietly fell back to debug signing.
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)"
          "$APKSIGNER" verify --print-certs "dist/Ritualist-android-${{ github.ref_name }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/dist/*.apk

  publish-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ritualist ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.apk
