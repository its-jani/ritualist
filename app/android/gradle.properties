# ---------------------------------------------------------------------------
# Java/Gradle toolchain contract (read before changing anything here).
#
# Pinned set: Gradle 8.12 + AGP 8.9.1 + Kotlin 2.1.0 - the exact combination the
# Flutter 3.35.3 template ships, and the newest one the Flutter tool knows
# (maxKnownAndSupportedAgpVersion = 8.9.1). Do not jump to Gradle 9.x to chase a
# newer JDK: the Flutter Gradle plugin in 3.35.3 is not Gradle 9 compatible.
#
# Known host collision (Windows + Android Studio 2026.1.x):
# Android Studio bundles JBR 25.0.3 and Flutter exports it as JAVA_HOME, so the
# Gradle 8.12 launcher starts on JVM 25. Its native-platform JNI load then trips
# the restricted-method block, and every task dies with the unhelpful message
# "* What went wrong: 25.0.3". Gradle 8.x only runs on JVM 17..23 (JVM 25 needs
# Gradle 9.1+), so the fix is to pin the JVM, never to patch versions here.
#
# Pin the JDK that runs Gradle (either one, both verified in this repo):
#   1. flutter config --jdk-dir="C:\Program Files\Java\jdk-17"  -> flutter run/build
#   2. org.gradle.java.home=C:/Program Files/Java/jdk-17 in
#      %USERPROFILE%\.gradle\gradle.properties -> also covers Android Studio and a
#      bare ./gradlew, and it wins over the project-level value.
#
# An absolute org.gradle.java.home works from this file too, but do not commit
# one: it is machine-specific and would break CI and other checkouts.
# GRADLE_USER_HOME\gradle.properties takes precedence over this file, which is
# exactly where a per-machine path belongs.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
